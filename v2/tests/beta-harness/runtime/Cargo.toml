[package]
name = "beta-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
[lib]
test = false
doctest = false
[dependencies]
serde_json = "=1.0.140"
log = "=0.4.27"
tempfile = "=3.19.1"
uuid = { version = "=1.16.0", features = ["v4"] }
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
cap-std = "=3.4.5"
tauri = { path = "../tauri" }
